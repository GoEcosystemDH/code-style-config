name: Publish npm packages to GitHub Packages

on:
  push:
    branches: [main]
    paths:
      - 'packages/eslint-config/**'
      - 'packages/prettier-config/**'
      - '.github/workflows/publish-npm.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish-eslint-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/eslint-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
      - run: npm install --ignore-scripts
      - name: Publish (allow failure if version exists)
        run: npm publish || echo "Version already published, skipping"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-prettier-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/prettier-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
      - run: npm install --ignore-scripts
      - name: Publish (allow failure if version exists)
        run: npm publish || echo "Version already published, skipping"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
